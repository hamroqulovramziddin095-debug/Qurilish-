<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qurilish nazorati</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LOGIN / RO‘YXATDAN O‘TISH -->
<div class="auth" id="auth">

    <div class="box">

        <h2 id="authTitle">Kirish</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="pass"
            type="password"
            placeholder="Parol"
        >

        <button id="authBtn" onclick="login()">
            Kirish
        </button>

        <button
            class="link"
            id="switch"
            onclick="registerMode()"
        >
            Ro‘yxatdan o‘tish
        </button>

        <div class="err" id="err"></div>

    </div>

</div>


<!-- CHAP MENYU -->
<aside class="side">

    <h2>🏗️ Qurilish</h2>

    <div id="blocks"></div>

</aside>


<!-- ASOSIY QISM -->
<main>

    <div class="top">

        <div>

            <small>QURILISH LOYIHASI</small>

            <h1 id="title">
                2-blok
            </h1>

            <p>
                Admin o‘zgartiradi, boshqa foydalanuvchilar faqat ko‘radi.
            </p>

        </div>

        <div>

            <span
                class="status"
                id="status"
            >
                Ulanmoqda...
            </span>

            <button onclick="logout()">
                Chiqish
            </button>

        </div>

    </div>


    <!-- STATISTIKA -->
    <div class="cards">

        <div class="card">
            O‘rtacha bajarilish
            <strong id="avg">0%</strong>
        </div>

        <div class="card">
            Jami summa
            <strong id="sum">0 so‘m</strong>
        </div>

        <div class="card">
            Ishlar
            <strong id="count">0</strong>
        </div>

        <div class="card">
            Tugagan
            <strong id="done">0</strong>
        </div>

    </div>


    <!-- JADVAL -->
    <section class="panel">

        <div class="head">
            <b id="head">
                2-blok — Ishlar
            </b>
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Ish turi</th>
                        <th>Material / uskuna</th>
                        <th>Reja</th>
                        <th>Sarflangan</th>
                        <th>Birlik</th>
                        <th>1 birlik narxi</th>
                        <th>Jami summa</th>
                        <th>Foiz</th>
                    </tr>

                </thead>

                <tbody id="table"></tbody>

            </table>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
